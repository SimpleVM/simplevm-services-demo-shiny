---
- name: Deploy simple Shiny app
  hosts: shiny_hosts
  become: true

  vars:
    repo_url: "https://github.com/SimpleVM/simplevm-services-demo-shiny.git"
    repo_dest: "/srv/shiny-server/shiny_100_repo"
    repo_version: "main"
    app_port: 3838
    location_url: ""
    shiny_server_deb_url: "https://download3.rstudio.org/ubuntu-20.04/x86_64/shiny-server-1.5.23.1030-amd64.deb"
    shiny_server_deb_path: "/tmp/shiny-server.deb"
    location_url_from_cli: "{{ location_url | default('', true) | length > 0 and location_url != '/shiny_100' }}"

  tasks:
    - name: Remove existing repository directory
      ansible.builtin.file:
        path: "{{ repo_dest }}"
        state: absent

    - name: Pull repository into service directory
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ repo_dest }}"
        version: "{{ repo_version }}"
        update: true
        force: true

    - name: Install dependencies
      ansible.builtin.apt:
        update_cache: true
        name:
          - r-base
          - r-cran-shiny
          - jq
        state: present

    - name: Fetch latest SimpleVM metadata
      ansible.builtin.shell: bash /etc/simplevm/utils/get_metadata.sh
      changed_when: false
      failed_when: false
      when: not location_url_from_cli

    - name: Read location_url from metadata.json
      ansible.builtin.shell: jq -r '.location_url // empty' /etc/simplevm/metadata.json 2>/dev/null
      register: location_url_raw
      changed_when: false
      failed_when: false
      when: not location_url_from_cli

    - name: Use location_url from metadata as subpath
      ansible.builtin.set_fact:
        location_url: "{{ location_url_raw.stdout }}"
      when:
        - not location_url_from_cli
        - location_url_raw is defined
        - location_url_raw.stdout | length > 0

    - name: Ensure location_url is set
      ansible.builtin.assert:
        that: location_url | length > 0
        fail_msg: >-
          location_url is not set.
          Either pass -e "location_url=<subpath>"
          or ensure /etc/simplevm/metadata.json contains a location_url field.
        success_msg: "location_url='{{ location_url }}'"

    - name: Install gdebi-core
      ansible.builtin.apt:
        name: gdebi-core
        state: present

    - name: Download Shiny Server
      ansible.builtin.get_url:
        url: "{{ shiny_server_deb_url }}"
        dest: "{{ shiny_server_deb_path }}"

    - name: Install Shiny Server
      ansible.builtin.shell: "gdebi -n {{ shiny_server_deb_path }}"
      args:
        creates: /usr/bin/shiny-server

    - name: Create symbolic link for Shiny app
      ansible.builtin.file:
        src: "{{ repo_dest }}/app"
        dest: "/srv/shiny-server/{{ location_url }}"
        state: link

    - name: Ensure Shiny Server is started and enabled
      ansible.builtin.systemd:
        name: shiny-server
        state: started
        enabled: true

    - name: Fix ownership for shiny user
      ansible.builtin.file:
        path: /srv/shiny-server
        owner: shiny
        group: shiny
        recurse: true
