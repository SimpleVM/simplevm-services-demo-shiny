---
- name: Deploy simple Shiny app
  hosts: shiny_hosts
  become: true

  vars:
    repo_url: "https://github.com/SimpleVM/simplevm-services-demo-shiny.git"
    repo_dest: "/srv/shiny-server/shiny_100_repo"
    repo_version: "fix/deployment"
    app_port: 3838
    location_url: "/shiny_100" #default subpath; override with: -e "location_url=/shiny_42"
    shiny_server_deb_url: "https://download3.rstudio.org/ubuntu-20.04/x86_64/shiny-server-1.5.23.1030-amd64.deb"
    shiny_server_deb_path: "/tmp/shiny-server.deb"

  tasks:
    - name: Fetch latest SimpleVM metadata
      ansible.builtin.shell: bash /etc/simplevm/utils/get_metadata.sh
      changed_when: true

    - name: Read location_url from metadata.json
      ansible.builtin.set_fact:
        location_url_from_metadata: "{{ (lookup('file', '/etc/simplevm/metadata.json', errors='ignore') | default('', true) | from_json | default({})).location_url | default(omit) }}"

    - name: Use location_url from metadata as subpath
      ansible.builtin.set_fact:
        location_url: "{{ location_url_from_metadata }}"
      when:
        - location_url_from_metadata is defined
        - location_url == "/shiny_100"

    - name: apt update
      ansible.builtin.apt:
        update_cache: true

    - name: Install R and Shiny
      ansible.builtin.apt:
        name:
          - r-base
          - r-cran-shiny
        state: present

    - name: Pull repository into service directory
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ repo_dest }}"
        version: "{{ repo_version }}"
        update: true
        force: true

    - name: Install gdebi-core
      ansible.builtin.apt:
        name: gdebi-core
        state: present

    - name: Download Shiny Server
      ansible.builtin.get_url:
        url: "{{ shiny_server_deb_url }}"
        dest: "{{ shiny_server_deb_path }}"

    - name: Install Shiny Server
      ansible.builtin.shell: "gdebi -n {{ shiny_server_deb_path }}"
      args:
        creates: /usr/bin/shiny-server

    - name: Create symbolic link for Shiny app
      ansible.builtin.file:
        src: "{{ repo_dest }}/app"
        dest: "/srv/shiny-server{{ location_url }}"
        state: link

    - name: Ensure Shiny Server is started and enabled
      ansible.builtin.systemd:
        name: shiny-server
        state: started
        enabled: true

    - name: Fix ownership for shiny user
      ansible.builtin.file:
        path: /srv/shiny-server
        owner: shiny
        group: shiny
        recurse: true
